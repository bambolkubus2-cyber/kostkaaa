<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziękujemy! | BrukBłysk</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/HERO.png">
    
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .neon-accent {
            color: #84fab0;
            text-shadow: 0 0 20px rgba(132, 250, 176, 0.5);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #0a0a0a;
            font-weight: 700;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(132, 250, 176, 0.5);
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(132, 250, 176, 0.1);
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            animation: scaleIn 0.5s ease-out;
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-6">
        <div class="max-w-2xl mx-auto glass p-8 md:p-12 text-center">
            <div class="success-icon">
                <i class="fas fa-check text-6xl text-gray-900"></i>
            </div>
            
            <h1 class="text-4xl md:text-5xl font-black mb-4">
                <span class="neon-accent">Dziękujemy!</span>
            </h1>
            
            <p class="text-xl md:text-2xl text-gray-300 mb-6">
                Twoja wiadomość została wysłana pomyślnie
            </p>
            
            <div class="bg-gray-900 bg-opacity-50 rounded-xl p-6 mb-8">
                <p class="text-gray-400 mb-4">
                    <i class="fas fa-clock text-lime-400 mr-2"></i>
                    <strong class="text-white">Odpowiemy w ciągu 24 godzin</strong>
                </p>
                <p class="text-gray-400">
                    Jeśli sprawa jest pilna, możesz zadzwonić:
                </p>
                <a href="tel:+48881578996" class="text-3xl font-bold neon-accent mt-2 inline-block">
                    <i class="fas fa-phone-alt mr-2"></i>
                    +48 881 578 996
                </a>
            </div>
            
            <div class="space-y-4">
                <a href="index.html" class="btn-primary justify-center w-full md:w-auto">
                    <i class="fas fa-home"></i>
                    Wróć na stronę główną
                </a>
                
                <div class="pt-4">
                    <p class="text-sm text-gray-500">Obsługujemy:</p>
                    <p class="text-gray-400 mt-2">
                        <i class="fas fa-map-marker-alt neon-accent mr-2"></i>
                        Radom, Grójec, Białobrzegi i okolice
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Auto-przekierowanie po 10 sekundach
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 10000);
    </script>
    
    <!-- BrukBłysk Custom Scripts -->
    <script src="script-brukblysk.js"></script>
</body>
</html>
